<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("mirror_theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Social — Marketer Mirror</title>
  <meta name="theme-color" content="#1D9E75" id="themeColorMeta">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-button" href="/marketer" aria-label="Back to Marketer Mirror">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
      </a>
      <span class="topbar-title">Social</span>
      <div class="topbar-actions" id="topbarActions">
        <button class="icon-button" id="themeToggleBtn" type="button" aria-label="Switch to dark mode"></button>
      </div>
    </header>

    <main class="content">
      <p class="page-lede">Tools for social content and creators.</p>

      <div class="section-label">Discover</div>
      <div class="tool-list">
        <a class="card tool-card" href="/marketer/social/post-ideas">
          <span class="tool-card-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.2 1 2.05V17h6v-.25c0-.85.4-1.65 1-2.05A7 7 0 0 0 12 2Z"/></svg>
          </span>
          <span class="tool-card-body">
            <span class="tool-card-name">Post Idea Finder</span>
            <span class="tool-card-desc">Post ideas for a topic, plus hashtags/keywords for the platforms you pick.</span>
          </span>
          <span class="tool-card-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </a>
      </div>
    </main>
  </div>

  <script src="/static/js/nav.js"></script>
  <script>
    MirrorNav.markLastUsed("marketer");
    MirrorNav.mountSwitcher(document.getElementById("topbarActions"), { active: "marketer" });
  </script>
</body>
</html>
