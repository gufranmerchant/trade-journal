<!doctype html>
<html lang="en" data-app="marketer">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("mirror_theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Social — Marketer Mirror</title>
  <meta name="theme-color" content="#0E1210" id="themeColorMeta">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:wght@500;600&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/static/css/marketer.css">
</head>
<body>
  <div class="app">
    <div id="mmHeader"></div>
    <script src="/static/js/nav.js"></script>
    <script>MirrorNav.mountMarketerShell({ back: { href: "/marketer", label: "Back to Marketer Mirror" } });</script>

    <main class="content">
      <section class="mm-hero mm-hero--compact">
        <span class="mm-badge mm-badge--purple">Lane: social</span>
        <h1 class="mm-h1">Tools for social content and creators.</h1>
        <p class="mm-hero-sub">Post ideas and platform tags &mdash; a starting point, always worth checking against the platform.</p>
      </section>

      <div class="section-label term-card-section">Discover</div>
      <div class="mm-tools">
        <a class="term term-card term-card--purple" href="/marketer/social/post-ideas">
          <div class="term-bar" aria-hidden="true"><span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span><span class="term-file">post_ideas.exe</span></div>
          <div class="term-body">
            <span class="term-card-icon purple" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.2 1 2.05V17h6v-.25c0-.85.4-1.65 1-2.05A7 7 0 0 0 12 2Z"/></svg></span>
            <span class="term-card-main">
              <span class="term-card-title">Post Idea Finder</span>
              <span class="term-card-desc">Post ideas for a topic, plus hashtags/keywords for the platforms you pick.</span>
              <span class="term-card-meta">04 &middot; ai-assisted</span>
            </span>
            <span class="term-card-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
          </div>
        </a>
      </div>
    </main>
  </div>

</body>
</html>
