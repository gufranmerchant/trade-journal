<!doctype html>
<html lang="en" data-app="marketer">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("mirror_theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Post Idea Finder — Marketer Mirror</title>
  <meta name="theme-color" content="#0E1210" id="themeColorMeta">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:wght@500;600&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/static/css/marketer.css">
</head>
<body>
  <div class="app">
    <div id="mmHeader"></div>
    <script src="/static/js/nav.js"></script>
    <script>MirrorNav.mountMarketerShell({ back: { href: "/marketer/social", label: "Back to Social" } });</script>

    <main class="content">
      <section class="mm-hero mm-hero--compact">
        <span class="mm-badge mm-badge--purple">Tool 04 &middot; social</span>
        <h1 class="mm-h1">Post Idea Finder</h1>
      </section>

      <p class="page-lede">
        Enter a content topic for AI-researched post ideas and platform
        hashtags/keywords to jumpstart your content plan — always verify
        against the platform before using them in a real post or campaign.
      </p>

      <section class="term" aria-label="Input">
        <div class="term-bar" aria-hidden="true"><span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span><span class="term-file">post_ideas.exe</span></div>
        <div class="term-body">
      <div class="field-block">
        <label class="field-label" for="topicInput">Content topic</label>
        <input class="text-input" type="text" id="topicInput" maxlength="300"
               placeholder="e.g. a small bakery launching a new sourdough bread line">
      </div>

      <div class="field-block">
        <label class="field-label">Platforms</label>
        <div class="chip-group" id="platformPicker" role="group" aria-label="Platforms">
          <button type="button" class="chip" data-platform="linkedin">LinkedIn</button>
          <button type="button" class="chip" data-platform="instagram">Instagram</button>
          <button type="button" class="chip" data-platform="tiktok">TikTok</button>
          <button type="button" class="chip" data-platform="youtube">YouTube</button>
          <button type="button" class="chip" data-platform="medium">Medium</button>
        </div>
      </div>

      <div class="error-banner hidden" id="errorBanner"></div>

      <button class="cta-button" id="generateBtn" type="button">Generate</button>
        </div>
      </section>

      <div class="loading-state hidden" id="loadingView" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-title">Generating…</p>
      </div>

      <div class="hidden results-stack term" id="resultsWrap" aria-live="polite">
        <div class="term-bar" aria-hidden="true"><span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span><span class="term-file">results.out</span></div>
        <div>
          <div class="section-label">Post ideas</div>
          <div class="idea-list" id="ideaList"></div>
        </div>

        <div class="platform-results-list" id="platformResults"></div>
      </div>
    </main>
  </div>


  <script>
    (() => {
      "use strict";
      const el = (id) => document.getElementById(id);

      // Mirrors app/post_ideas.py's PLATFORM_LABELS — used only to label the
      // results the backend already keyed by these same lowercase platform
      // keys, in the same canonical order.
      const PLATFORM_LABELS = {
        linkedin: "LinkedIn",
        instagram: "Instagram",
        tiktok: "TikTok",
        youtube: "YouTube",
        medium: "Medium",
      };

      // User-typed topic and model-generated idea/tag/reason text all go
      // through this before hitting innerHTML.
      const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));

      function showError(message) {
        el("errorBanner").textContent = message;
        el("errorBanner").classList.remove("hidden");
      }
      function hideError() {
        el("errorBanner").classList.add("hidden");
      }
      function hideResults() {
        el("resultsWrap").classList.add("hidden");
      }

      function selectedPlatforms() {
        return Array.from(document.querySelectorAll("#platformPicker .chip.active"))
          .map((btn) => btn.dataset.platform);
      }

      function tagChips(items) {
        return (items || []).map((t) => `
          <span class="chip chip-static" title="${escapeHtml(t.reason || "")}">${escapeHtml(t.tag)}</span>
        `).join("") || `<p class="section-hint">None suggested.</p>`;
      }

      function renderResults(data) {
        el("ideaList").innerHTML = (data.ideas || []).map((idea, i) => `
          <div class="card idea-card">
            <div class="idea-card-number">${i + 1}</div>
            <div class="idea-card-body">
              <div class="idea-card-title">${escapeHtml(idea.idea)}</div>
              ${idea.rationale ? `<div class="idea-card-rationale">${escapeHtml(idea.rationale)}</div>` : ""}
            </div>
          </div>
        `).join("") || `<p class="section-hint">No ideas suggested.</p>`;

        const platformTags = data.platform_tags || {};
        el("platformResults").innerHTML = Object.keys(platformTags).map((key) => `
          <div class="card platform-tag-card">
            <div class="section-label">${escapeHtml(PLATFORM_LABELS[key] || key)}</div>
            <div class="chip-static-list">${tagChips(platformTags[key])}</div>
          </div>
        `).join("");

        el("resultsWrap").classList.remove("hidden");
      }

      async function generate() {
        // Clear the previous result BEFORE validating, so a rejected
        // submission never leaves stale results visible under the error.
        hideError();
        hideResults();
        const topic = el("topicInput").value.trim();
        const platforms = selectedPlatforms();

        if (!topic) {
          showError("Enter a content topic.");
          return;
        }
        if (platforms.length === 0) {
          showError("Select at least one platform.");
          return;
        }

        const btn = el("generateBtn");
        btn.disabled = true;
        el("loadingView").classList.remove("hidden");

        try {
          const res = await fetch("/tools/post-ideas", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic, platforms }),
          });
          if (!res.ok) {
            let message = `Request failed (${res.status})`;
            try {
              const body = await res.json();
              if (body && body.detail) message = body.detail;
            } catch (_) {}
            throw new Error(message);
          }
          renderResults(await res.json());
        } catch (err) {
          showError(err.message || "Couldn't generate ideas — try again.");
        } finally {
          btn.disabled = false;
          el("loadingView").classList.add("hidden");
        }
      }

      document.querySelectorAll("#platformPicker .chip").forEach((btn) => {
        btn.addEventListener("click", () => btn.classList.toggle("active"));
      });

      el("generateBtn").addEventListener("click", generate);
      el("topicInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") generate();
      });
    })();
  </script>
</body>
</html>
