<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("mirror_theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mirror</title>
  <meta name="theme-color" content="#1D9E75">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Mirror</span>
      </div>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <main class="content">
      <p class="page-lede">Pick a tool to get started.</p>

      <div class="tool-list" id="toolList">
        <a class="card tool-card" data-tool="trading" href="/trading">
          <span class="tool-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          </span>
          <span class="tool-card-body">
            <span class="tool-card-name">Trading Mirror</span>
            <span class="tool-card-desc">Log trades from a screenshot and get judged against your own strategy rules.</span>
          </span>
          <span class="tool-card-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </a>

        <a class="card tool-card" data-tool="marketer" href="/marketer">
          <span class="tool-card-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
          </span>
          <span class="tool-card-body">
            <span class="tool-card-name">Marketer Mirror</span>
            <span class="tool-card-desc">KDP break-even math and an ads report analyser.</span>
          </span>
          <span class="tool-card-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </a>
      </div>
    </main>
  </div>

  <script src="/static/js/nav.js"></script>
  <script>
    // Last-used tool (see app/static/js/nav.js, MirrorNav.markLastUsed — set
    // by each tool page on load) no longer redirects away from this page —
    // "/" is always the picker. Instead it just moves that tool's card to
    // the front and labels it, so a returning visitor sees where they left
    // off without losing the ability to land on the picker itself. A
    // first-ever visit (nothing stored yet) leaves the default order alone.
    (function () {
      var lastTool = MirrorNav.getLastUsed();
      if (lastTool !== "trading" && lastTool !== "marketer") return;

      var list = document.getElementById("toolList");
      var card = list.querySelector('.tool-card[data-tool="' + lastTool + '"]');
      if (!card) return;

      var badge = document.createElement("span");
      badge.className = "tool-card-badge";
      badge.textContent = "Continue where you left off";
      card.querySelector(".tool-card-body").insertBefore(badge, card.querySelector(".tool-card-name"));

      list.insertBefore(card, list.firstChild);
    })();
  </script>
</body>
</html>
