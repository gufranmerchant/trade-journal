<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // Redirect gateway only — not the picker itself (see /tools, served by
    // app/static/tools.html). A visitor with a saved tool preference (see
    // app/static/js/nav.js, MirrorNav.markLastUsed) goes straight there;
    // everyone else falls through to the actual picker at /tools. This
    // split exists so the nav switcher's "Home" link always reaches the
    // picker even for a visitor who already has a tool saved — it used to
    // point at "/" directly, which just bounced them straight back.
    (function () {
      var target = "/tools";
      try {
        var lastTool = localStorage.getItem("mirror_last_tool");
        if (lastTool === "trading") {
          target = "/trading";
        } else if (lastTool === "marketer") {
          target = "/marketer";
        }
      } catch (e) {}
      location.replace(target);
    })();
    (function () {
      try {
        var stored = localStorage.getItem("mirror_theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mirror</title>
  <meta name="theme-color" content="#1D9E75">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <main class="content">
      <div class="loading-state" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
      </div>
    </main>
  </div>
</body>
</html>
