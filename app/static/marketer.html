<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("mirror_theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marketer Mirror</title>
  <meta name="theme-color" content="#1D9E75" id="themeColorMeta">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Marketer Mirror</span>
      </div>
      <div class="topbar-actions" id="topbarActions">
        <button class="icon-button" id="themeToggleBtn" type="button" aria-label="Switch to dark mode"></button>
      </div>
    </header>

    <main class="content">
      <p class="page-lede">Tools for authors and marketers.</p>

      <a class="card tool-card" href="/marketer/kdp-breakeven">
        <span class="tool-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </span>
        <span class="tool-card-body">
          <span class="tool-card-name">KDP Break-Even Calculator</span>
          <span class="tool-card-desc">Royalty per sale, break-even ACOS, and max CPC by conversion rate.</span>
        </span>
        <span class="tool-card-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </span>
      </a>

      <a class="card tool-card" href="/marketer/ads-analyser">
        <span class="tool-card-icon purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 3 5-8"/></svg>
        </span>
        <span class="tool-card-body">
          <span class="tool-card-name">Ads Report Analyser</span>
          <span class="tool-card-desc">Upload a Meta Ads export and get per-campaign CTR/CPC/CPA with problem campaigns flagged.</span>
        </span>
        <span class="tool-card-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </span>
      </a>
    </main>
  </div>

  <script src="/static/js/nav.js"></script>
  <script>
    MirrorNav.markLastUsed("marketer");
    MirrorNav.mountSwitcher(document.getElementById("topbarActions"), { active: "marketer" });
  </script>
</body>
</html>
