<!doctype html>
<html lang="en" data-design="instrument">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("mirror_theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KDP Break-Even Calculator — Marketer Mirror</title>
  <meta name="theme-color" content="#0E1210" id="themeColorMeta">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:wght@500;600&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/static/css/instrument.css">
</head>
<body>
  <div class="app">
    <div id="mmHeader"></div>
    <script src="/static/js/nav.js"></script>
    <script>MirrorNav.mountShell({ back: { href: "/marketer/books", label: "Back to Books" } });</script>

    <main class="content">
      <section class="mm-hero mm-hero--compact">
        <span class="mm-badge">Tool 01 &middot; books</span>
        <h1 class="mm-h1">KDP Break-Even Calculator</h1>
      </section>

      <section class="term" aria-label="Input">
        <div class="term-bar" aria-hidden="true"><span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span><span class="term-file">break_even.exe</span></div>
        <div class="term-body">
      <div class="field-block">
        <label class="field-label">Format</label>
        <div class="segmented" id="formatToggle" role="group" aria-label="Format">
          <button type="button" class="segment-btn active" data-value="ebook">Ebook</button>
          <button type="button" class="segment-btn" data-value="paperback">Paperback</button>
        </div>
      </div>

      <div class="field-block">
        <label class="field-label" for="listPrice">List price ($)</label>
        <input class="text-input" type="number" id="listPrice" step="0.01" min="0" placeholder="6.99">
      </div>

      <div id="ebookFields">
        <div class="field-block">
          <label class="field-label">Royalty plan</label>
          <div class="segmented" id="planToggle" role="group" aria-label="Royalty plan">
            <button type="button" class="segment-btn active" data-value="70">70%</button>
            <button type="button" class="segment-btn" data-value="35">35%</button>
          </div>
        </div>

        <div id="deliveryFields">
          <div class="field-grid">
            <div class="field-block">
              <label class="field-label" for="fileSize">File size (MB)</label>
              <input class="text-input" type="number" id="fileSize" step="0.1" min="0" placeholder="1.7">
            </div>
            <div class="field-block">
              <label class="field-label" for="deliveryFee">Delivery fee ($/MB)</label>
              <input class="text-input" type="number" id="deliveryFee" step="0.01" min="0" placeholder="0.15">
            </div>
          </div>
        </div>
      </div>

      <div id="paperbackFields" class="hidden">
        <div class="field-grid">
          <div class="field-block">
            <label class="field-label" for="royaltyRate">Royalty rate (%)</label>
            <input class="text-input" type="number" id="royaltyRate" step="1" min="0" max="100" placeholder="60">
          </div>
          <div class="field-block">
            <label class="field-label" for="printingCost">Printing cost ($)</label>
            <input class="text-input" type="number" id="printingCost" step="0.01" min="0" placeholder="2.30">
          </div>
        </div>
      </div>

      <div class="error-banner hidden" id="errorBanner" role="alert"></div>

      <button class="cta-button" id="calcBtn" type="button">Calculate</button>

      </div>
      </section>

      <div class="fact-grid term hidden" id="resultCard" aria-live="polite">
        <div class="term-bar" aria-hidden="true"><span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span><span class="term-file">result.out</span></div>
        <div class="fact-item">
          <span class="fact-label">Royalty per sale</span>
          <span class="fact-value" id="resultRoyalty">—</span>
        </div>
        <div class="fact-item">
          <span class="fact-label">Break-even ACOS</span>
          <span class="fact-value" id="resultAcos">—</span>
        </div>
        <div class="fact-item">
          <span class="fact-label">Max CPC @ 5% conv.</span>
          <span class="fact-value" id="resultCpc5">—</span>
        </div>
        <div class="fact-item">
          <span class="fact-label">Max CPC @ 10% conv.</span>
          <span class="fact-value" id="resultCpc10">—</span>
        </div>
        <div class="fact-item">
          <span class="fact-label">Max CPC @ 15% conv.</span>
          <span class="fact-value" id="resultCpc15">—</span>
        </div>
      </div>
    </main>
  </div>


  <script>
    (() => {
      "use strict";
      const el = (id) => document.getElementById(id);

      let format = "ebook";
      let plan = "70";

      function selectFormat(value) {
        format = value;
        el("formatToggle").querySelectorAll(".segment-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.value === value);
        });
        el("ebookFields").classList.toggle("hidden", value !== "ebook");
        el("paperbackFields").classList.toggle("hidden", value !== "paperback");
        hideError();
        hideResult();
      }

      function selectPlan(value) {
        plan = value;
        el("planToggle").querySelectorAll(".segment-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.value === value);
        });
        el("deliveryFields").classList.toggle("hidden", value !== "70");
        hideResult();
      }

      function showError(message) {
        el("errorBanner").textContent = message;
        el("errorBanner").classList.remove("hidden");
      }

      function hideError() {
        el("errorBanner").classList.add("hidden");
      }

      function hideResult() {
        el("resultCard").classList.add("hidden");
      }

      function renderResult(result) {
        el("resultRoyalty").textContent = `$${result.royalty_per_sale.toFixed(2)}`;
        el("resultAcos").textContent = `${(result.breakeven_acos * 100).toFixed(0)}%`;
        el("resultCpc5").textContent = `$${result.max_cpc_5pct.toFixed(2)}`;
        el("resultCpc10").textContent = `$${result.max_cpc_10pct.toFixed(2)}`;
        el("resultCpc15").textContent = `$${result.max_cpc_15pct.toFixed(2)}`;
        el("resultCard").classList.remove("hidden");
      }

      // A type=number input reports "" both when empty and when it holds
      // non-numeric text (validity.badInput), so check badInput to tell
      // "empty" from "invalid" apart. min is the smallest allowed value.
      const readNum = (id, min, inclusive) => {
        const input = el(id);
        if (input.validity.badInput) return { state: "invalid" };
        if (input.value.trim() === "") return { state: "empty" };
        const n = Number(input.value);
        if (!isFinite(n) || (inclusive ? n < min : n <= min)) return { state: "invalid" };
        return { state: "ok", value: n };
      };

      async function calculate() {
        hideError();
        hideResult();
        const fail = (results, emptyMsg, invalidMsg) => {
          if (results.some((r) => r.state === "invalid")) return showError(invalidMsg), true;
          if (results.some((r) => r.state === "empty")) return showError(emptyMsg), true;
          return false;
        };

        const price = readNum("listPrice", 0, false);
        if (fail([price], "Enter a list price.", "Enter a valid price above $0.")) return;
        const listPrice = price.value;

        const payload = { format, list_price: listPrice };
        if (format === "ebook") {
          payload.plan = plan;
          if (plan === "70") {
            const size = readNum("fileSize", 0, false);
            const fee = readNum("deliveryFee", 0, true);
            if (fail([size, fee], "Enter file size and delivery fee per MB.",
                     "Enter a valid file size above 0 MB and a delivery fee of $0 or more.")) return;
            payload.file_size_mb = size.value;
            payload.delivery_fee_per_mb = fee.value;
          }
        } else {
          const rate = readNum("royaltyRate", 0, false);
          const cost = readNum("printingCost", 0, true);
          if (rate.state === "ok" && rate.value > 100) rate.state = "invalid";
          if (fail([rate, cost], "Enter royalty rate and printing cost.",
                   "Enter a royalty rate between 1 and 100 and a printing cost of $0 or more.")) return;
          payload.royalty_rate = rate.value / 100;
          payload.printing_cost = cost.value;
        }

        const btn = el("calcBtn");
        btn.disabled = true;
        try {
          const res = await fetch("/tools/kdp-breakeven", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!res.ok) {
            let message = `Request failed (${res.status})`;
            try {
              const body = await res.json();
              if (body && body.detail) message = body.detail;
            } catch (_) {}
            throw new Error(message);
          }
          renderResult(await res.json());
        } catch (err) {
          showError(err.message || "Couldn't calculate — try again.");
        } finally {
          btn.disabled = false;
        }
      }

      el("formatToggle").querySelectorAll(".segment-btn").forEach((btn) => {
        btn.addEventListener("click", () => selectFormat(btn.dataset.value));
      });
      el("planToggle").querySelectorAll(".segment-btn").forEach((btn) => {
        btn.addEventListener("click", () => selectPlan(btn.dataset.value));
      });
      el("calcBtn").addEventListener("click", calculate);
      // A shown result is only true for the exact inputs it was calculated from, so
      // ANY edit to any field (valid, invalid or emptied) clears it - not just the
      // values that happen to trip validation. The plan toggle does the same below.
      ["listPrice", "fileSize", "deliveryFee", "royaltyRate", "printingCost"].forEach((id) => {
        el(id).addEventListener("input", hideResult);
      });
    })();
  </script>
</body>
</html>
